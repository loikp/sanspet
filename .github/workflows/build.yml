name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # 把默认的 app-release.apk 改成 SansPet_v1.0.0.apk 这种名字。
      # 版本号直接从 build.gradle.kts 里读，以后改版本不用再动这个文件。
      - name: Rename APK
        run: |
          VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName = $VER"
          cd app/build/outputs/apk/release
          mv app-release.apk "SansPet_v$VER.apk"
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SansPet-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
