name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 配了 KEYSTORE_BASE64 这个 secret 就用正式签名；没配就跳过，退回 debug。
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::没有配 KEYSTORE_BASE64，这次用 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > sanspet-release.jks
          {
            echo "storeFile=sanspet-release.jks"
            echo "storePassword=$KS_PASSWORD"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_KEY_PASSWORD"
          } > keystore.properties
          echo "已写入正式签名配置，alias = $KS_ALIAS"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # 把实际用的签名打印出来，一眼能看出有没有换上正式签名
      - name: Show APK signing
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            app/build/outputs/apk/release/*.apk | head -20 || true

      # 把默认的 app-release.apk 改成 SansPet_v1.0.0.apk 这种名字。
      # 版本号直接从 build.gradle.kts 里读，以后改版本不用再动这个文件。
      - name: Rename APK
        run: |
          VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName = $VER"
          cd app/build/outputs/apk/release
          mv app-release.apk "SansPet_v$VER.apk"
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SansPet-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
