<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SansPet 设置</title>
<link rel="stylesheet" href="style.css">
<style>
  html { height: 100%; }
  body {
    background: var(--black); color: var(--white);
    min-height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 14px calc(60px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: 2px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 22px; }
  section { border: 3px solid var(--white); padding: 14px; margin-bottom: 16px; }
  section h2 { font-size: 15px; margin: 0 0 12px; color: var(--yellow); }
  label { display: block; font-size: 12px; color: #aaa; margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number], textarea, select {
    width: 100%; background: #000; color: var(--white);
    border: 3px solid var(--white); border-radius: 0;
    font-family: inherit; font-size: 14px; padding: 9px 10px; outline: none;
  }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .status { font-size: 13px; }
  .ok { color: #4ade80; }
  .bad { color: #ff5c5c; }
  .hint { color: #777; font-size: 11px; margin-top: 6px; line-height: 1.5; }
  .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; }
  .checkbox input { width: 20px; height: 20px; accent-color: var(--yellow); }
  /* 用 CSS 打码，不用 type=password，避免调起安全键盘 */
  .masked { -webkit-text-security: disc; }
</style>
</head>
<body>

<h1>SANS PET</h1>
<div class="sub">一个住在你手机里的角色</div>

<section>
  <h2>桌宠</h2>
  <div class="status">悬浮窗权限：<span id="permStatus">检查中…</span></div>
  <div class="row">
    <button id="btnPerm" class="brutal-btn orange">授予悬浮窗权限</button>
    <button id="btnToggle" class="brutal-btn blue">开启桌宠</button>
  </div>
  <div class="hint">开启后回到桌面就能看到 Sans。第一次需要先去系统设置里允许本应用显示在其他应用上层。</div>
</section>

<section>
  <h2>AI 接口</h2>
  <label>Base URL（支持 OPENAI 兼容格式）</label>
  <input id="baseUrl" type="text" placeholder="https://api.deepseek.com/v1">
  <label>API Key</label>
  <div class="row" style="margin-top:0">
    <input id="apiKey" class="masked" type="text" placeholder="sk-..." autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:120px">
    <button id="btnKeyToggle" class="icon-btn" title="显示/隐藏"><img id="iconKeyToggle" src="icons/eye.svg" alt="显示"></button>
  </div>
  <label>模型</label>
  <div class="row" style="margin-top:0">
    <input id="model" type="text" list="models" placeholder="deepseek-flash" style="flex:1;min-width:140px">
    <button id="btnModels" class="brutal-btn orange">获取模型列表</button>
  </div>
  <datalist id="models">
    <option value="deepseek-flash"></option>
    <option value="deepseek-chat"></option>
    <option value="deepseek-reasoner"></option>
    <option value="gpt-4o-mini"></option>
    <option value="gpt-4o"></option>
    <option value="qwen-plus"></option>
    <option value="glm-4-flash"></option>
  </datalist>
  <select id="modelSelect" class="hidden" size="6" style="margin-top:10px"></select>
  <div class="hint">先填好 Base URL 和 API Key，再点「获取模型列表」，从下面选一个。</div>
  <label>温度（0 - 2）</label>
  <input id="temperature" type="number" step="0.1" min="0" max="2">
  <div class="hint">Key 只保存在本机。</div>
</section>

<section>
  <h2>角色人设</h2>
  <label>你的名字（选填）</label>
  <input id="userName" type="text" placeholder="留空的话 Sans 不会叫你名字">
  <label>系统提示词</label>
  <textarea id="systemPrompt" placeholder="留空则使用内置 Sans 人设"></textarea>
  <label>用户人设（选填）</label>
  <textarea id="userPersona" placeholder="描述一下你自己，比如「我是学生，喜欢打游戏，最近在准备考试」。留空则不发送。"></textarea>
  <div class="row">
    <button id="btnResetPrompt" class="brutal-btn orange">恢复默认人设</button>
  </div>
</section>

<section>
  <h2>外观</h2>
  <label>Sans 大小（0.8 - 1.8）</label>
  <input id="petScale" type="number" min="0.8" max="1.8" step="0.1">
  <div class="hint">保存后会立刻生效。</div>
</section>

<section>
  <h2>对话</h2>
  <label>上下文条数（超出自动忘记最旧的）</label>
  <input id="contextLimit" type="number" min="4" max="100" step="2">
  <div class="checkbox"><input id="sound" type="checkbox"><label for="sound" style="margin:0">开启像素音效</label></div>
</section>

<section>
  <h2>主动回复</h2>
  <div class="checkbox"><input id="proactive" type="checkbox"><label for="proactive" style="margin:0">允许 Sans 主动开口</label></div>
  <label>触发概率（每次检查）</label>
  <input id="proactiveRate" type="number" min="0" max="1" step="0.01">
  <div class="hint">每 45 秒检查一次，概率越低越安静。</div>
</section>

<section>
  <h2>对话历史</h2>

  <div class="row">
    <button id="btnClear" class="brutal-btn orange">清空全部历史</button>
  </div>
</section>

<div class="row">
  <button id="btnSave" class="brutal-btn blue" style="min-width:150px">保存设置</button>
</div>

<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
